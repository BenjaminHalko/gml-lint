name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:pack
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          tgz="packages/eslint-plugin/eslint-plugin-gml-${version}.tgz"
          test -f "$tgz" || { echo "::error::$tgz not found; does the tag match the eslint-plugin-gml version?"; exit 1; }
          gh release create "$TAG" "$tgz" --title "$TAG" --notes "Install with \`pnpm add -D https://github.com/${{ github.repository }}/releases/download/${TAG}/eslint-plugin-gml-${version}.tgz\`."
